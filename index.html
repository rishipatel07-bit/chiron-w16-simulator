#sd{margin:6px 0 0;font-size:12px}

@media(max-width:720px){#hud{width:min(280px,calc(100% - 24px))}#info{top:auto;left:12px;right:12px;width:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-height:22vh;overflow:auto}}
